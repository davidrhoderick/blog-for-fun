type Query {
  post(id: ID!): Post
  postBySlug(slug: Slug!): Post
  posts: [Post!]!
  postRevision(id: ID!): PostRevision
  """
  Revisions for a post, ordered by descending revision number, newest first.
  """
  postRevisions(
    postId: ID!
    """
    The number of revisions to return. Defaults to 20 and must be between 0 and 100.
    """
    first: Int
    """
    Return revisions after the cursor from a previous page's `pageInfo.endCursor`.
    """
    after: String
  ): PostRevisionConnection!
}

type Mutation {
  putPost(input: PutPostInput!): Post!
  deletePost(id: ID!): DeletedEntity
}

input PutPostInput {
  id: ID
  slug: Slug
  title: NonEmptyString
  markdownContent: String
}

type DeletedPost implements DeletedEntity {
  id: ID!
}

type Post implements Entity {
  id: ID!
  slug: Slug!
  title: NonEmptyString!
  markdownContent: String!
  createdAt: DateTimeISO!
  updatedAt: DateTimeISO!
  """
  Revisions ordered by descending revision number, newest first.
  """
  revisions(
    """
    The number of revisions to return. Defaults to 20 and must be between 0 and 100.
    """
    first: Int
    """
    Return revisions after the cursor from a previous page's `pageInfo.endCursor`.
    """
    after: String
  ): PostRevisionConnection!
}

type PostRevisionConnection {
  edges: [PostRevisionEdge!]!
  nodes: [PostRevision!]!
  pageInfo: PageInfo!
}

type PostRevisionEdge {
  cursor: String!
  node: PostRevision!
}

type PageInfo {
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  startCursor: String
  endCursor: String
}

type PostRevision implements Entity {
  id: ID!
  revisionNumber: Int!
  title: NonEmptyString!
  markdownContent: String!
  createdAt: DateTimeISO!
  post: Post!
}
