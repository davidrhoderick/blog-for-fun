name: Verify

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      JEV_API_KEY: ${{ secrets.JEV_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install scan tools
        run: |
          go install github.com/google/osv-scanner/v2/cmd/osv-scanner@v2.7.0
          go install github.com/sigstore/cosign/v2/cmd/cosign@v2.4.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          curl -fsSL https://raw.githubusercontent.com/opengrep/opengrep/main/install.sh | bash -s -- -v v1.31.0 --verify-signatures
          echo "$HOME/.opengrep/cli/latest" >> "$GITHUB_PATH"

      - name: Select review base
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$PR_BASE_SHA"
          elif [[ "$PUSH_BEFORE" =~ ^0+$ ]]; then
            base="4b825dc642cb6eb9a060e54bf8d69288fbee4904"
          else
            base="$PUSH_BEFORE"
          fi
          echo "VERIFY_BASE_REF=$base" >> "$GITHUB_ENV"

      - name: Run trust pipeline
        run: pnpm verify

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-reports-${{ github.run_id }}
          path: |
            report/
            .artifacts/features/
          if-no-files-found: ignore
          retention-days: 7
